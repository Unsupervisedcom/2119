name: release

# Publish to npm when a version tag is pushed (`npm version <bump> && git push --follow-tags`).
#
# Why this exists: `dist/` is gitignored, so a hand-run `npm publish` ships whatever happened to
# be in the local working tree. Building here makes the published artifact reproducible from the
# tagged commit — the tag and the tarball can't disagree.
#
# `prepublishOnly` (npm test && node dist/cli.js check) still runs inside `npm publish`, so the
# suite and 2119's own gate remain the last thing between a tag and the registry. The explicit
# steps below just make a failure legible in the log instead of buried in publish output.
#
# Auth is npm trusted publishing (OIDC): npmjs.com is configured to trust this repo + workflow
# filename, and the job exchanges the `id-token` for a short-lived credential at publish time.
# There is no NPM_TOKEN secret to leak, rotate, or accidentally scope too widely. Provenance is
# generated automatically from the OIDC claims, so the artifact is attested to this commit.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC exchange for npm trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x. Pinned to 11.x on
      # purpose: npm 12 changed install-time defaults so dependency lifecycle scripts no longer
      # run unless explicitly allowed, and this package's tree needs esbuild's postinstall to
      # link its platform binary. Moving to 12 is a deliberate migration (npm approve-scripts
      # --allow-scripts-pending, committed allowlist), not something to inherit from @latest.
      - run: npm install --global npm@11

      - run: npm ci

      # Refuse to publish a tag whose version doesn't match package.json — the failure mode
      # this workflow exists to prevent is a tag and an artifact that disagree.
      - name: Verify tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - run: npm run build
      - run: npm test
      - run: node dist/cli.js check

      # No NODE_AUTH_TOKEN: credentials come from the OIDC exchange (see header).
      - run: npm publish --access public
